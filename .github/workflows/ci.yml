# Quality gates from CLAUDE.md §16. Steps are plain shell commands so they port to Azure DevOps unchanged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  backend:
    name: Back end (build, format, tests, vulnerabilities, API client)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tesseract OCR with Arabic and English data (ADR 0033)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Strategy.slnx
      - name: Build (warnings are errors)
        run: dotnet build Strategy.slnx -c Release --no-restore
      - name: Format
        run: dotnet format Strategy.slnx --verify-no-changes --no-restore
      - name: Tests (unit, architecture)
        # The integration tests run in the "integration" job, in two shards (one runner for the whole suite ran out of resources).
        run: |
          dotnet test --project tests/Strategy.UnitTests -c Release --no-build --report-xunit-trx --results-directory ${{ github.workspace }}/TestResults
          dotnet test --project tests/Strategy.ArchitectureTests -c Release --no-build --report-xunit-trx --results-directory ${{ github.workspace }}/TestResults
      - name: Name the failing tests
        if: failure()
        # The job log is too long for its end to show which test failed: print each failed test and its message from the TRX files.
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for path in glob.glob('TestResults/**/*.trx', recursive=True):
              for r in ET.parse(path).getroot().iterfind('.//t:UnitTestResult', ns):
                  if r.get('outcome') == 'Failed':
                      message = r.find('.//t:Message', ns)
                      print(f"::error::{r.get('testName')}")
                      print((message.text or '')[:2000] if message is not None else '')
          PY
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/**/*.trx
          retention-days: 14
      - name: Vulnerable packages (High / Critical fail)
        run: tools/check-vulnerable.sh
      - name: OpenAPI document and generated TS client are committed
        run: |
          (cd web && npm ci --no-audit --no-fund)
          tools/check-api-client.sh

  integration:
    name: Integration tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Module systems / platform (everything else): together exactly the whole suite (checked with --list-tests).
        shard: [modules, platform]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Tesseract OCR with Arabic and English data (ADR 0033)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Restore and build
        run: |
          dotnet tool restore
          dotnet build tests/Strategy.IntegrationTests -c Release
      - name: Integration tests (Testcontainers)
        run: |
          # Memory and disk once a minute: if the runner is lost again, the log shows what ran out.
          (while true; do echo "resources $(date -u +%H:%M) $(free -m | awk '/Mem:/ {print "mem used " $3 " / " $2 " MB"}') $(df -h / | awk 'NR==2 {print "disk " $3 " / " $2}')"; sleep 60; done) &
          modules="Portfolio Tasks Reporting Kpi Teams AuditManagement Risk Requests Cap Bench"
          filters=()
          for n in $modules; do
            if [ "${{ matrix.shard }}" = modules ]; then filters+=(--filter-namespace "Strategy.IntegrationTests.$n*"); else filters+=(--filter-not-namespace "Strategy.IntegrationTests.$n*"); fi
          done
          dotnet test --project tests/Strategy.IntegrationTests -c Release --no-build "${filters[@]}" --report-xunit-trx --results-directory ${{ github.workspace }}/TestResults
      - name: Name the failing tests
        if: failure()
        # The job log is too long for its end to show which test failed: print each failed test and its message from the TRX files.
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for path in glob.glob('TestResults/**/*.trx', recursive=True):
              for r in ET.parse(path).getroot().iterfind('.//t:UnitTestResult', ns):
                  if r.get('outcome') == 'Failed':
                      message = r.find('.//t:Message', ns)
                      print(f"::error::{r.get('testName')}")
                      print((message.text or '')[:2000] if message is not None else '')
          PY
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results-${{ matrix.shard }}
          path: TestResults/**/*.trx
          retention-days: 14


  frontend:
    name: Front end (lint, format, types, tests, build, audit, licences)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (ESLint + RTL logical-class guard)
        run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm audit (High / Critical fail)
        run: npm audit --audit-level=high
      - name: Licence allow-list
        run: npm run lint:licenses

  e2e:
    name: E2E (Arabic + English)
    needs: [backend, integration, frontend]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strategy
          POSTGRES_USER: strategy
          POSTGRES_PASSWORD: strategy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strategy" --health-interval 5s --health-timeout 5s --health-retries 20
      # Invitation and password-reset emails are read back from Mailpit's API by the sign-in specs.
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
      # The History tab's PDF export is rendered by Gotenberg (appsettings.Development.json: http://localhost:3000).
      gotenberg:
        image: gotenberg/gotenberg:8
        ports: ["3000:3000"]
    env:
      CI: "true"
      ConnectionStrings__Strategy: Host=localhost;Port=5432;Database=strategy;Username=strategy;Password=strategy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tesseract OCR with Arabic and English data (ADR 0033); pdftoppm renders the Teams memo / certificate PDFs to PNG
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng poppler-utils
      - name: Install and build
        run: |
          dotnet build src/Host/Strategy.Host/Strategy.Host.csproj
          cd web
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
      - name: Playwright (projects ar and en, then the accessibility audit ar-a11y / en-a11y)
        working-directory: web
        run: npx playwright test
      - name: Playwright first-run setup wizard on an empty database (ar and en, ADR 0150)
        working-directory: web
        run: npx playwright test -c playwright.setup.config.ts
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            docs/screenshots
          retention-days: 14

  # Visual regression per theme (ADR 0175): the browser runs in a pinned Playwright container with the product fonts installed from the
  # locked npm packages (tools/visual-regression.sh), so rendering is identical on every run. Required for pull requests.
  visual:
    name: Visual regression (themes)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strategy
          POSTGRES_USER: strategy
          POSTGRES_PASSWORD: strategy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strategy" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
      gotenberg:
        image: gotenberg/gotenberg:8
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pull the pinned Playwright image
        run: docker pull mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      - name: Install and build
        run: |
          dotnet build src/Host/Strategy.Host/Strategy.Host.csproj
          cd web
          npm ci --no-audit --no-fund
          npm run build
      - name: Start the host on a fresh Development database
        working-directory: web
        # Only this step sees the Development database: the build's OpenAPI generation must not seed it without the authenticator key.
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Strategy: Host=localhost;Port=5432;Database=strategy;Username=strategy;Password=strategy
          Spa__RootPath: ../../../web/dist
          RateLimiting__PermitLimit: "10000"
          RateLimiting__AuthPermitLimit: "1000"
          Seed__AdminTotpKey: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        run: |
          nohup dotnet run --no-build --project ../src/Host/Strategy.Host --no-launch-profile --urls http://localhost:5080 > ../host.log 2>&1 &
          timeout 300 bash -c 'until curl -sf http://localhost:5080/health/ready > /dev/null; do sleep 3; done'
      - name: Compare with the committed baselines (UPDATE_SNAPSHOTS=1 to rewrite them, ADR 0175)
        env:
          E2E_BASE_URL: http://localhost:5080
          CI: "true"
        run: tools/visual-regression.sh
      - name: Upload differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: |
            web/test-results
            host.log
          retention-days: 14

  docker:
    name: Container image (build, scan, SBOM, deploy scripts)
    needs: [backend, integration, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the versioned image (not pushed)
        run: |
          VERSION="$(cat deploy/VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build -f deploy/Dockerfile -t "strategy-app:$VERSION" \
            --build-arg APP_VERSION="$VERSION" --build-arg GIT_REVISION="${GITHUB_SHA::7}" \
            --build-arg BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      - name: Image runs as non-root with labels and a healthcheck
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' "strategy-app:$VERSION")" != "root"
          test -n "$(docker image inspect -f '{{.Config.Healthcheck}}' "strategy-app:$VERSION")"
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "strategy-app:$VERSION")" = "$VERSION"
      - name: Vulnerability scan (Trivy — High / Critical with a fix fail, ADR 0156) and CycloneDX SBOM
        run: IMAGE="strategy-app:$VERSION" ./deploy/sbom.sh --scan
      - name: Upload SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: release/sbom/
          retention-days: 90
      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml --profile app --profile dev --profile search --profile antivirus --profile ai config -q
      - name: Deploy scripts (shellcheck, PowerShell parser)
        run: |
          shellcheck -x deploy/*.sh deploy/postgres/init-roles.sh
          pwsh -NoProfile -File tools/check-powershell.ps1 deploy

  # Deploy scripts against a fake docker in a release folder without .git (ADR 0163): bash and PowerShell 7 on Linux, PSScriptAnalyzer.
  deploy-scripts:
    name: Deploy scripts on Linux (bash, PowerShell 7, PSScriptAnalyzer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck and PowerShell parser / encoding check
        run: |
          shellcheck -x deploy/*.sh deploy/postgres/init-roles.sh tests/deploy/*.sh
          pwsh -NoProfile -File tools/check-powershell.ps1 deploy
          pwsh -NoProfile -File tools/check-powershell.ps1 tests/deploy
      - name: bash scripts (install, backup, restore, upgrade)
        run: tests/deploy/test-deploy-scripts.sh
      - name: PowerShell scripts under PowerShell 7
        run: pwsh -NoProfile -File tests/deploy/Test-DeployScripts.ps1 -Shell pwsh
      - name: PSScriptAnalyzer (syntax and commands compatible with Windows PowerShell 5.1)
        shell: pwsh
        run: ./tests/deploy/Invoke-ScriptAnalysis.ps1

  # GitHub's Windows runners only run Windows containers: the .ps1 scripts run against the fake docker under 5.1 and 7 (ADR 0163).
  deploy-windows:
    name: Deploy scripts on Windows (PowerShell 5.1 and 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PowerShell parser / encoding check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/check-powershell.ps1 deploy
      - name: PowerShell scripts under Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/deploy/Test-DeployScripts.ps1 -Shell powershell.exe
      - name: PowerShell scripts under PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File tests/deploy/Test-DeployScripts.ps1 -Shell pwsh
