# HTTPS reverse proxy in front of the Integrated Strategy System (nginx ≥ 1.18). ADR 0157, docs/guides/en/installation.md.
#
# 1. Replace strategy.example.org and the certificate paths. 2. Copy to /etc/nginx/conf.d/strategy.conf. 3. nginx -t && systemctl reload nginx.
# 4. In deploy/.env (Docker) or the service environment (non-Docker):
#      FORWARDED_HEADERS_ENABLED=true                 (ForwardedHeaders__Enabled=true)
#      FORWARDED_HEADERS_PROXY=<this proxy's IP as the application sees it, e.g. 172.17.0.1 for Docker on the same host>
#      APP_BIND=127.0.0.1                             (Docker: publish the app on loopback only, so every request passes the proxy)
# The MCP server's OAuth sign-in requires HTTPS (MCP_REQUIRE_HTTPS=true); the X-Forwarded-Proto header below tells the app the scheme.

upstream strategy_app {
    server 127.0.0.1:8080;          # APP_PORT (Docker) or the Kestrel URL of the systemd service
    keepalive 32;
}

# SignalR (/hubs/notifications) uses WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name strategy.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx < 1.25: use "listen 443 ssl http2;" instead
    server_name strategy.example.org;

    ssl_certificate     /etc/ssl/strategy/fullchain.pem;
    ssl_certificate_key /etc/ssl/strategy/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:strategy:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (the application also sends it on HTTPS requests). Remove "preload" unless the domain is on the preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Uploads: Settings → Files allows up to 25 MB by default; keep this a little above the configured limit.
    client_max_body_size 30m;
    # AI document extraction, PDF and Excel exports can take a while.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Never expose the health endpoints' details beyond the internal network (they carry no secrets, but no need).
    location /health/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://strategy_app;
    }

    location /hubs/ {
        proxy_pass http://strategy_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://strategy_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # MCP Streamable HTTP responses are streamed (server-sent events).
        proxy_buffering off;
    }
}
